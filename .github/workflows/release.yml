name: Automated Release & Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Firebase Configuration
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          config_path = pathlib.Path("app/google-services.json")
          if not config_path.is_file() or config_path.stat().st_size == 0:
              raise SystemExit("::error::Missing or empty app/google-services.json; release build aborted.")

          data = json.loads(config_path.read_text(encoding="utf-8"))
          project_id = data.get("project_info", {}).get("project_id")
          expected_project = "gen-lang-client-0258473942"
          if project_id != expected_project:
              raise SystemExit(
                  f"::error::app/google-services.json project_id mismatch: expected {expected_project}, found {project_id!r}."
              )

          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in data.get("client", [])
          ]
          expected_package = "com.aistudio.crashintelligence.vyfrip"
          if expected_package not in packages:
              raise SystemExit(
                  f"::error::app/google-services.json does not contain package {expected_package}; found {packages!r}."
              )

          print(f"Verified app/google-services.json for Firebase project {project_id} and package {expected_package}.")
          PY

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Same validation as build-apk.yml: the ANDROID_RELEASE_SIGNING secret
      # holds a base64 JSON {storePassword, keyPassword, keyAlias, keystoreBase64}.
      # Validates the keystore with keytool, falls back to the store password
      # for the key, and forces keyPassword = storePassword for PKCS12
      # keystores (where the two must be equal). Fails loudly instead of
      # publishing an unsigned APK when the credentials are unusable.
      - name: Configure Release Signing
        env:
          ANDROID_RELEASE_SIGNING: ${{ secrets.ANDROID_RELEASE_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess

          raw = os.environ.get("ANDROID_RELEASE_SIGNING", "").strip()
          if not raw:
              raise SystemExit("::error::ANDROID_RELEASE_SIGNING secret is not set; cannot build a signed release APK.")
          keystore_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-keystore.jks"
          csr_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-key-check.csr"
          data = json.loads(base64.b64decode(raw, validate=True).decode("utf-8"))
          required = ("storePassword", "keyPassword", "keyAlias", "keystoreBase64")
          if any(not isinstance(data.get(key), str) or not data[key] for key in required):
              raise SystemExit("::error::ANDROID_RELEASE_SIGNING is missing a required field (storePassword/keyPassword/keyAlias/keystoreBase64).")
          print(f"::add-mask::{data['storePassword']}")
          print(f"::add-mask::{data['keyPassword']}")
          keystore_path.write_bytes(base64.b64decode(data["keystoreBase64"], validate=True))
          validation_env = os.environ.copy()
          validation_env["VIBE_RELEASE_STORE_PASSWORD"] = data["storePassword"]
          validation_env["VIBE_RELEASE_KEY_PASSWORD"] = data["keyPassword"]
          list_result = subprocess.run(
              ["keytool", "-list", "-keystore", str(keystore_path),
               "-storepass:env", "VIBE_RELEASE_STORE_PASSWORD",
               "-alias", data["keyAlias"]],
              stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True, env=validation_env)
          if list_result.returncode != 0:
              raise SystemExit("::error::Keystore validation failed: store password or alias is wrong.")
          def validate_key_password(password):
              validation_env["VIBE_RELEASE_KEY_PASSWORD"] = password
              return subprocess.run(
                  ["keytool", "-certreq", "-keystore", str(keystore_path),
                   "-storepass:env", "VIBE_RELEASE_STORE_PASSWORD",
                   "-alias", data["keyAlias"],
                   "-keypass:env", "VIBE_RELEASE_KEY_PASSWORD",
                   "-file", str(csr_path)],
                  stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True, env=validation_env)
          key_result = validate_key_password(data["keyPassword"])
          if key_result.returncode != 0:
              key_result = validate_key_password(data["storePassword"])
              if key_result.returncode == 0:
                  data["keyPassword"] = data["storePassword"]
              else:
                  raise SystemExit("::error::Private key password validation failed: neither keyPassword nor storePassword opens the key.")
          metadata = subprocess.check_output(
              ["keytool", "-list", "-keystore", str(keystore_path),
               "-storepass:env", "VIBE_RELEASE_STORE_PASSWORD"],
              text=True, env=validation_env)
          store_type = next(
              (line.split(":", 1)[1].strip() for line in metadata.splitlines()
               if line.lower().startswith("keystore type:")),
              "")
          if not store_type:
              raise SystemExit("::error::Could not determine keystore type.")
          if store_type.upper() == "PKCS12":
              data["keyPassword"] = data["storePassword"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"KEYSTORE_PATH={keystore_path}\n")
              env_file.write(f"STORE_PASSWORD={data['storePassword']}\n")
              env_file.write(f"KEY_ALIAS={data['keyAlias']}\n")
              env_file.write(f"KEY_PASSWORD={data['keyPassword']}\n")
              env_file.write(f"KEYSTORE_TYPE={store_type}\n")
          print("Release signing credentials validated.")
          PY

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Build Release App Bundle (AAB)
        run: gradle bundleRelease --no-daemon

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          test -s "$APK"
          BUILD_TOOLS_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          APKSIGNER=$(find "$BUILD_TOOLS_DIR" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          AAPT2=$(find "$BUILD_TOOLS_DIR" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          test -n "$AAPT2"
          RESOURCES_FILE="${RUNNER_TEMP:-/tmp}/apk-resources.txt"
          "$AAPT2" dump resources "$APK" > "$RESOURCES_FILE"
          grep -q "google_app_id" "$RESOURCES_FILE"
          grep -q "gen-lang-client-0258473942" "$RESOURCES_FILE"
          rm -f "$RESOURCES_FILE"
          echo "Verified Firebase configuration resources inside release APK."
          sha256sum "$APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Release Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-keystore.jks" "${RUNNER_TEMP}/release-key-check.csr"
