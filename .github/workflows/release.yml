name: Automated Release & Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare release signing
        shell: bash
        run: |
          if [ -n "${ANDROID_SIGNING_BUNDLE:-}" ]; then
            python3 - <<'PY'
            import base64, json, os
            from pathlib import Path
            bundle = json.loads(base64.b64decode(os.environ["ANDROID_SIGNING_BUNDLE"]))
            keystore_path = Path(os.environ["RUNNER_TEMP"]) / "vibe-coding-release.jks"
            keystore_path.write_bytes(base64.b64decode(bundle["keystore_base64"]))
            keystore_path.chmod(0o600)
            with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                env.write(f"KEYSTORE_PATH={keystore_path}\n")
                env.write(f"STORE_PASSWORD={bundle['store_password']}\n")
                env.write(f"KEY_ALIAS={bundle['key_alias']}\n")
                env.write(f"KEY_PASSWORD={bundle['key_password']}\n")
            PY
          else
            echo "Release signing secrets are not configured."
          fi

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Build Release App Bundle (AAB)
        run: gradle bundleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
