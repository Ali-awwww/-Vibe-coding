name: Automated Release & Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Release Signing
        env:
          ANDROID_RELEASE_SIGNING: ${{ secrets.ANDROID_RELEASE_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get("ANDROID_RELEASE_SIGNING", "").strip()
          if not raw:
              print("ANDROID_RELEASE_SIGNING not set; release artifacts will remain unsigned.")
              raise SystemExit(0)
          data = json.loads(base64.b64decode(raw).decode("utf-8"))
          for secret_key in ("storePassword", "keyPassword"):
              print(f"::add-mask::{data[secret_key]}")
          ks_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-keystore.jks"
          ks_path.write_bytes(base64.b64decode(data["keystoreBase64"]))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"KEYSTORE_PATH={ks_path}\n")
              env_file.write(f"STORE_PASSWORD={data['storePassword']}\n")
              env_file.write(f"KEY_ALIAS={data['keyAlias']}\n")
              env_file.write(f"KEY_PASSWORD={data['keyPassword']}\n")
          print("Release signing configured successfully.")
          PY

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Build Release App Bundle (AAB)
        run: gradle bundleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Release Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-keystore.jks"
