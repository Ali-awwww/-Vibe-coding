name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashIntelligence-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Configure Release Signing
        env:
          ANDROID_RELEASE_SIGNING: ${{ secrets.ANDROID_RELEASE_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get("ANDROID_RELEASE_SIGNING", "").strip()
          if not raw:
              print("ANDROID_RELEASE_SIGNING not set; release build will remain unsigned.")
              raise SystemExit(0)
          data = json.loads(base64.b64decode(raw).decode("utf-8"))
          for secret_key in ("storePassword", "keyPassword"):
              print(f"::add-mask::{data[secret_key]}")
          ks_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-keystore.jks"
          ks_path.write_bytes(base64.b64decode(data["keystoreBase64"]))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"KEYSTORE_PATH={ks_path}\n")
              env_file.write(f"STORE_PASSWORD={data['storePassword']}\n")
              env_file.write(f"KEY_ALIAS={data['keyAlias']}\n")
              env_file.write(f"KEY_PASSWORD={data['keyPassword']}\n")
          print("Release signing configured successfully.")
          PY

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashIntelligence-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Clean Up Release Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-keystore.jks"
