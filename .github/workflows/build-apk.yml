name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Unified Debug Signing
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, subprocess

          ks_path = pathlib.Path("debug.keystore")
          b64_secret = os.environ.get("ANDROID_DEBUG_KEYSTORE_BASE64", "").strip()
          if b64_secret:
              ks_path.write_bytes(base64.b64decode(b64_secret))
              print("Materialized debug.keystore from ANDROID_DEBUG_KEYSTORE_BASE64 secret.")
          elif pathlib.Path("debug.keystore.base64").exists():
              ks_path.write_bytes(base64.b64decode(pathlib.Path("debug.keystore.base64").read_text().strip()))
              print("Materialized debug.keystore from repository debug.keystore.base64.")
          else:
              print("::warning::No debug keystore source found; AGP default debug keystore will be used.")
              raise SystemExit(0)

          out = subprocess.check_output(
              ["keytool", "-list", "-v", "-keystore", str(ks_path), "-storepass", "android", "-alias", "androiddebugkey"],
              text=True,
          )
          sha1_match = re.search(r"SHA1:\s*([0-9A-Fa-f:]+)", out)
          sha256_match = re.search(r"SHA256:\s*([0-9A-Fa-f:]+)", out)
          if sha1_match:
              sha1_colon = sha1_match.group(1).upper()
              sha1_hex = sha1_colon.replace(":", "").lower()
              print(f"Debug Keystore SHA-1: {sha1_colon}")
              if sha256_match:
                  print(f"Debug Keystore SHA-256: {sha256_match.group(1).upper()}")
              gs_path = pathlib.Path("app/google-services.json")
              if gs_path.exists():
                  gs_text = gs_path.read_text(encoding="utf-8")
                  if sha1_hex not in gs_text.lower():
                      print(
                          f"::warning::Debug SHA-1 ({sha1_colon}) is not listed in app/google-services.json. "
                          "Add this SHA-1 in Firebase Console or set ANDROID_DEBUG_KEYSTORE_BASE64 so Google Sign-In works on devices."
                      )
          PY

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashIntelligence-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Configure Release Signing
        id: release_signing
        env:
          ANDROID_RELEASE_SIGNING: ${{ secrets.ANDROID_RELEASE_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import subprocess

          output_path = os.environ["GITHUB_OUTPUT"]

          def set_mode(mode):
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write(f"mode={mode}\n")

          raw = os.environ.get("ANDROID_RELEASE_SIGNING", "").strip()
          if not raw:
              print("ANDROID_RELEASE_SIGNING not set; building an unsigned release APK.")
              set_mode("unsigned")
              raise SystemExit(0)

          keystore_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-keystore.jks"
          csr_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-key-check.csr"
          try:
              data = json.loads(base64.b64decode(raw, validate=True).decode("utf-8"))
              required = ("storePassword", "keyPassword", "keyAlias", "keystoreBase64")
              if any(not isinstance(data.get(key), str) or not data[key] for key in required):
                  raise ValueError("Missing release signing field")

              print(f"::add-mask::{data['storePassword']}")
              print(f"::add-mask::{data['keyPassword']}")
              keystore_path.write_bytes(base64.b64decode(data["keystoreBase64"], validate=True))

              validation_env = os.environ.copy()
              validation_env["VIBE_RELEASE_STORE_PASSWORD"] = data["storePassword"]
              validation_env["VIBE_RELEASE_KEY_PASSWORD"] = data["keyPassword"]
              list_result = subprocess.run(
                  [
                      "keytool", "-list", "-keystore", str(keystore_path),
                      "-storepass:env", "VIBE_RELEASE_STORE_PASSWORD",
                      "-alias", data["keyAlias"]
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  env=validation_env
              )
              if list_result.returncode != 0:
                  raise ValueError("Keystore or alias validation failed")

              key_result = subprocess.run(
                  [
                      "keytool", "-certreq", "-keystore", str(keystore_path),
                      "-storepass:env", "VIBE_RELEASE_STORE_PASSWORD",
                      "-alias", data["keyAlias"],
                      "-keypass:env", "VIBE_RELEASE_KEY_PASSWORD",
                      "-file", str(csr_path)
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.PIPE,
                  text=True,
                  env=validation_env
              )
              if key_result.returncode != 0:
                  raise ValueError("Private key password validation failed")

              metadata = subprocess.check_output(
                  [
                      "keytool", "-list", "-keystore", str(keystore_path),
                      "-storepass:env", "VIBE_RELEASE_STORE_PASSWORD"
                  ],
                  text=True,
                  env=validation_env
              )
              store_type = next(
                  (line.split(":", 1)[1].strip() for line in metadata.splitlines()
                   if line.lower().startswith("keystore type:")),
                  ""
              )
              if not store_type:
                  raise ValueError("Could not determine keystore type")

              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"KEYSTORE_PATH={keystore_path}\n")
                  env_file.write(f"STORE_PASSWORD={data['storePassword']}\n")
                  env_file.write(f"KEY_ALIAS={data['keyAlias']}\n")
                  env_file.write(f"KEY_PASSWORD={data['keyPassword']}\n")
                  env_file.write(f"KEYSTORE_TYPE={store_type}\n")
              set_mode("signed")
              print("Release signing credentials validated.")
          except Exception:
              keystore_path.unlink(missing_ok=True)
              csr_path.unlink(missing_ok=True)
              print("::warning::Release signing credentials could not be validated. Building an unsigned release APK; no secret settings were changed.")
              set_mode("unsigned")
          PY

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashIntelligence-Release-APK-${{ steps.release_signing.outputs.mode }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Clean Up Keystores
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-keystore.jks" "${RUNNER_TEMP}/release-key-check.csr" "debug.keystore"
