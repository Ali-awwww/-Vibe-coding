name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare release signing
        shell: bash
        run: |
          if [ -n "${ANDROID_SIGNING_BUNDLE:-}" ]; then
            python3 - <<'PY'
            import base64, json, os
            from pathlib import Path
            bundle = json.loads(base64.b64decode(os.environ["ANDROID_SIGNING_BUNDLE"]))
            keystore_path = Path(os.environ["RUNNER_TEMP"]) / "vibe-coding-release.jks"
            keystore_path.write_bytes(base64.b64decode(bundle["keystore_base64"]))
            keystore_path.chmod(0o600)
            with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                env.write(f"KEYSTORE_PATH={keystore_path}\n")
                env.write(f"STORE_PASSWORD={bundle['store_password']}\n")
                env.write(f"KEY_ALIAS={bundle['key_alias']}\n")
                env.write(f"KEY_PASSWORD={bundle['key_password']}\n")
            PY
          else
            echo "Release signing secrets are not configured; building unsigned release artifacts."
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashIntelligence-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashIntelligence-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
