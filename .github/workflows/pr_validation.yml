name: Pull Request Validation

on:
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  pr-validation:
    name: Validate Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Unified Debug Signing
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          ks_path = pathlib.Path("debug.keystore")
          b64_secret = os.environ.get("ANDROID_DEBUG_KEYSTORE_BASE64", "").strip()
          if b64_secret:
              ks_path.write_bytes(base64.b64decode(b64_secret))
          elif pathlib.Path("debug.keystore.base64").exists():
              ks_path.write_bytes(base64.b64decode(pathlib.Path("debug.keystore.base64").read_text().strip()))
          PY

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Clean Up Debug Keystore
        if: always()
        run: rm -f "debug.keystore"
