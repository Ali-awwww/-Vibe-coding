name: Android Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Cache Maven and Robolectric artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.robolectric
            ~/.cache/firebase/emulators
          key: ${{ runner.os }}-robolectric-emulators-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-emulators-

      - name: Set up Node.js for Firebase Emulators
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Unit Tests with Firebase Emulators
        run: firebase emulators:exec --project demo-no-project --only auth,firestore "gradle testDebugUnitTest --no-daemon"

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
